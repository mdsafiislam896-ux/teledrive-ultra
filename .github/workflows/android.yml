name: Android CI

on:
  push:
    branches: [ "feat/native-tdlib-auth", "feat/nexacloud-premium", "main" ]
  pull_request:
    branches: [ "feat/native-tdlib-auth", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 26.3.11579264
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli perl ninja-build wget unzip zip

      - name: Configure Android SDK tools
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"

      - name: Checkout official TDLib source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tdlib/td
          path: tdlib-src
          fetch-depth: 1

      - name: Build OpenSSL and TDLib JNI for Android
        working-directory: tdlib-src/example/android
        run: |
          chmod +x ./*.sh
          ./check-environment.sh
          ./build-openssl.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_VERSION" third-party/openssl
          ./build-tdlib.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_VERSION" third-party/openssl c++_static Java 21 "arm64-v8a armeabi-v7a"

      - name: Stage TDLib Java bindings and native libraries
        run: |
          mkdir -p app/src/main/java/org/drinkless/tdlib
          mkdir -p app/src/main/jniLibs
          cp tdlib-src/example/android/tdlib/java/org/drinkless/tdlib/*.java app/src/main/java/org/drinkless/tdlib/
          cp -R tdlib-src/example/android/tdlib/libs/* app/src/main/jniLibs/
          test -f app/src/main/jniLibs/arm64-v8a/libtdjni.so
          test -f app/src/main/java/org/drinkless/tdlib/Client.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Decode release keystore
        run: |
          mkdir -p "$RUNNER_TEMP"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d -i > "$RUNNER_TEMP/teledrive-release.jks"
          else
            echo "Generating deterministic fallback keystore so release build never skips..."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/teledrive-release.jks" \
              -alias "${ANDROID_KEY_ALIAS:-teledrive_release}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${ANDROID_KEYSTORE_PASSWORD:-teledrive123}" \
              -keypass "${ANDROID_KEY_PASSWORD:-teledrive123}" \
              -dname "CN=TeleDrive Release, O=TeleDrive, C=US"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD:-teledrive123}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-teledrive_release}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-teledrive123}" >> "$GITHUB_ENV"
          fi
          test -s "$RUNNER_TEMP/teledrive-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/teledrive-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teledrive-ultra-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teledrive-ultra-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
