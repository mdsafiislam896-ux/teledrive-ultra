name: Android CI

on:
  push:
    branches: [ "feat/native-tdlib-auth", "main" ]
  pull_request:
    branches: [ "feat/native-tdlib-auth", "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 26.3.11579264
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - name: Checkout app
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf php-cli perl ninja-build wget unzip zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android SDK / NDK / CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;3.22.1"

      - name: Checkout official TDLib source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tdlib/td
          path: tdlib-src
          fetch-depth: 1

      - name: Build OpenSSL and TDLib JNI for Android
        working-directory: tdlib-src/example/android
        run: |
          chmod +x ./*.sh
          ./check-environment.sh
          ./build-openssl.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_VERSION" third-party/openssl
          ./build-tdlib.sh "$ANDROID_SDK_ROOT" "$ANDROID_NDK_VERSION" third-party/openssl c++_static Java 21 "arm64-v8a armeabi-v7a"

      - name: Stage TDLib Java bindings and native libraries
        run: |
          mkdir -p app/src/main/java/org/drinkless/tdlib
          mkdir -p app/src/main/jniLibs
          cp tdlib-src/example/android/tdlib/java/org/drinkless/tdlib/*.java app/src/main/java/org/drinkless/tdlib/
          cp -R tdlib-src/example/android/tdlib/libs/* app/src/main/jniLibs/
          test -f app/src/main/jniLibs/arm64-v8a/libtdjni.so
          test -f app/src/main/java/org/drinkless/tdlib/Client.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: teledrive-ultra-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
